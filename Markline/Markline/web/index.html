<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markline</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar"></header>
  <div id="tabs"></div>
  <div id="main">
    <aside id="left">
      <div class="ptabs">
        <button data-p="pages" class="on">Pages</button>
        <button data-p="chest">Tool Chest</button>
      </div>
      <div id="pagesPane">
        <div class="pagebar" id="pagebar"></div>
        <div id="thumbs"></div>
      </div>
      <div id="chestPane" hidden></div>
    </aside>
    <section id="center">
      <div id="stage">
        <canvas id="base"></canvas>
        <canvas id="over"></canvas>
        <textarea id="editor" spellcheck="false" hidden></textarea>
        <div id="welcome">
          <div class="wbox">
            <div class="logo">Markline</div>
            <p>PDF markup and takeoff for construction drawings.</p>
            <button id="wopen" class="primary">Open PDF…</button>
            <p class="dim">or drop a PDF anywhere in this window</p>
          </div>
        </div>
        <div id="busy" hidden><span></span></div>
      </div>
      <div id="list">
        <div id="listbar"></div>
        <div id="listwrap"><table id="ltable"><thead></thead><tbody></tbody></table></div>
      </div>
    </section>
    <aside id="right">
      <div id="props"></div>
      <div id="scale"></div>
    </aside>
  </div>
  <footer id="status"></footer>
</div>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="js/core.js"></script>
<script src="js/pdfio.js"></script>
<script src="js/app.js"></script>
</body>
</html>
